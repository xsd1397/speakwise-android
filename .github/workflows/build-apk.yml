name: Build Android APK (Bypass EAS)

on:
  workflow_dispatch:
    inputs:
      backend_url:
        description: 'Public SpeakWise API origin'
        required: true
        default: 'https://speakwise-wsicpu2u.manus.space'

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Expo Prebuild
        env:
          EXPO_PUBLIC_API_URL: ${{ github.event.inputs.backend_url }}
          EXPO_PUBLIC_BACKEND_URL: ${{ github.event.inputs.backend_url }}
        run: npx expo prebuild --platform android --clean

      - name: Build APK via Gradle
        working-directory: ./android
        env:
          EXPO_PUBLIC_API_URL: ${{ github.event.inputs.backend_url }}
          EXPO_PUBLIC_BACKEND_URL: ${{ github.event.inputs.backend_url }}
          NODE_OPTIONS: "--max-old-space-size=4096"
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: speakwise-release-apk
          path: android/app/build/outputs/apk/release/*.apk
